name: Aquileia 3D browser verification

on:
  push:
    branches: [main]
    paths:
      - "aquileia/index.html"
      - ".github/workflows/aquileia-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the site locally
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/aquileia-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/aquileia/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aquileia-http.log
          exit 1
      - name: Verify geometry changes, five eras, and map interaction
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 950 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push('PAGE: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            await page.goto('http://127.0.0.1:8000/aquileia/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__AQUILEIA_TEST__ && window.__AQUILEIA_TEST__.drawCalls > 0, { timeout: 30000 });
            const snapshot = async () => page.evaluate(() => ({
              stage: window.__AQUILEIA_TEST__.stage,
              drawCalls: window.__AQUILEIA_TEST__.drawCalls,
              sceneObjects: window.__AQUILEIA_TEST__.sceneObjects,
              landmarks: window.__AQUILEIA_TEST__.landmarks,
              counts: window.__AQUILEIA_TEST__.counts,
              title: document.querySelector('#eraTitle').textContent
            }));
            const assert = (ok, message, data) => { if (!ok) throw new Error(message + ' ' + JSON.stringify(data)); };
            await page.waitForTimeout(1000);
            const colony = await snapshot();
            assert(colony.drawCalls > 40, 'No substantial WebGL scene rendered.', colony);
            assert(colony.landmarks >= 5, 'Expected interactive 3D landmarks were not created.', colony);
            assert(colony.counts.earlyHouses > 0 && colony.counts.romanHouses === 0, 'Colony phase does not show its distinct building set.', colony);
            await page.screenshot({ path: 'artifacts/01-colony.png' });

            const results = [colony];
            const expected = {
              1: s => s.counts.romanHouses > 0 && s.counts.ships > 0,
              2: s => s.counts.walls > 0,
              3: s => s.counts.fires > 0,
              4: s => s.counts.modernBuildings > 0 && s.counts.ruins > 0
            };
            const screenshots = {
              1: 'artifacts/02-imperial-city.png',
              2: 'artifacts/03-christian-city.png',
              3: 'artifacts/04-sack-452.png',
              4: 'artifacts/05-modern-landscape.png'
            };
            for (const stage of [1, 2, 3, 4]) {
              await page.locator('button[data-era="' + stage + '"]').click();
              await page.waitForFunction(expectedStage => window.__AQUILEIA_TEST__?.stage === expectedStage, stage, { timeout: 5000 });
              await page.waitForTimeout(1100);
              const state = await snapshot();
              assert(expected[stage](state), 'Geometry for historical stage ' + stage + ' did not become active.', state);
              results.push(state);
              await page.screenshot({ path: screenshots[stage] });
            }
            await page.locator('#modeMap').click();
            await page.waitForFunction(() => document.body.classList.contains('map-mode'));
            await page.waitForTimeout(250);
            await page.locator('#mode3d').click();
            await page.waitForFunction(() => !document.body.classList.contains('map-mode'));
            assert(errors.length === 0, 'Browser errors detected.', errors);
            console.log(JSON.stringify({ verified: results, mapToggle: 'passed', consoleErrors: errors.length }, null, 2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save five browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquileia-3d-five-era-check
          path: artifacts/*.png
          if-no-files-found: ignore
