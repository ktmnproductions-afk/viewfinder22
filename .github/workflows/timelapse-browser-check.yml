name: Map Art Lab Three.js browser smoke test

on:
  pull_request:
    paths:
      - "map-art-lab/timelapse.html"
      - "map-art-lab/index.html"
      - ".github/workflows/timelapse-browser-check.yml"
  push:
    branches: [main]
    paths:
      - "map-art-lab/timelapse.html"
      - "map-art-lab/index.html"
      - ".github/workflows/timelapse-browser-check.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/map-art-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/map-art-lab/timelapse.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/map-art-http.log
          exit 1
      - name: Verify the Three.js scene and main controls
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const zlib = require('zlib');
          function crc32(buffer) {
            let c = 0xffffffff;
            for (const byte of buffer) {
              c ^= byte;
              for (let k = 0; k < 8; k++) c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0);
            }
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(name, data) {
            const type = Buffer.from(name);
            const len = Buffer.alloc(4); len.writeUInt32BE(data.length);
            const crcInput = Buffer.concat([type, data]);
            const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(crcInput));
            return Buffer.concat([len, type, data, crc]);
          }
          function png(r, g, b) {
            const signature = Buffer.from([137,80,78,71,13,10,26,10]);
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(1, 0); ihdr.writeUInt32BE(1, 4);
            ihdr[8] = 8; ihdr[9] = 6;
            const scanline = Buffer.from([0, r, g, b, 255]);
            return Buffer.concat([signature, chunk('IHDR', ihdr), chunk('IDAT', zlib.deflateSync(scanline)), chunk('IEND', Buffer.alloc(0))]);
          }
          const tilePng = png(130, 80, 30);
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const tileResponse = route => route.fulfill({
              status: 200,
              contentType: 'image/png',
              headers: { 'Access-Control-Allow-Origin': '*' },
              body: tilePng
            });
            await page.route('https://s3.amazonaws.com/elevation-tiles-prod/terrarium/**', tileResponse);
            await page.route('https://gibs.earthdata.nasa.gov/**', tileResponse);
            await page.route('https://tiles.maps.eox.at/**', tileResponse);
            await page.goto('http://127.0.0.1:8000/map-art-lab/timelapse.html', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => typeof window.__MAP_ART_TIMELAPSE_TEST__ === 'function', { timeout: 30000 });
            await page.waitForFunction(() => {
              const state = window.__MAP_ART_TIMELAPSE_TEST__();
              return state.drawCalls > 0 && state.hasTerrain;
            }, { timeout: 60000 });
            await page.screenshot({ path: 'artifacts/map-art-timelapse.png' });
            const initial = await page.evaluate(() => window.__MAP_ART_TIMELAPSE_TEST__());
            if (!initial.hasCanvas || initial.drawCalls < 1 || !initial.hasTerrain) throw new Error('Three.js terrain scene did not render: ' + JSON.stringify(initial));

            await page.locator('#yearSlider').evaluate(el => {
              el.value = '2017';
              el.dispatchEvent(new Event('input', { bubbles: true }));
              el.dispatchEvent(new Event('change', { bubbles: true }));
            });
            await page.waitForFunction(() => window.__MAP_ART_TIMELAPSE_TEST__().year === 2017);
            if ((await page.locator('#yearOutput').textContent()) !== '2017') throw new Error('Year control did not update the displayed date.');

            await page.locator('#addPointBtn').click();
            if (!(await page.locator('#keyCount').textContent()).includes('1 point')) throw new Error('Camera waypoint button did not update its count.');
            await page.locator('#dockBtn').click();
            if (!(await page.locator('#dock').evaluate(el => el.classList.contains('closed')))) throw new Error('Studio control panel did not close.');
            if (errors.length) throw new Error('Browser runtime errors: ' + errors.join(' | '));
            console.log(JSON.stringify({ initial, yearControl: 'passed', cameraWaypoint: 'passed', panelToggle: 'passed', pageErrors: errors.length }, null, 2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-art-lab-threejs-smoke-test
          path: artifacts/*.png
          if-no-files-found: ignore
