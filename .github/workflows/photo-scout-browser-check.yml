name: Photo Scout browser verification

on:
  push:
    branches:
      - main
      - "assistant/**"
      - "fix/**"
    paths:
      - "index.html"
      - "photo-scout.html"
      - "sw.js"
      - ".github/workflows/photo-scout-browser-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "photo-scout.html"
      - "sw.js"
      - ".github/workflows/photo-scout-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Validate Photo Scout JavaScript module syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const opening = '<script type="module">';
          const start = html.indexOf(opening);
          if (start < 0) throw new Error('No Photo Scout module script found');
          const bodyStart = html.indexOf('>', start) + 1;
          const end = html.indexOf('</script>', bodyStart);
          if (bodyStart <= 0 || end < 0) throw new Error('Photo Scout module script is not closed');
          const source = html.slice(bodyStart, end);
          fs.writeFileSync('/tmp/photo-scout-check.mjs', source);
          console.log('Extracted module source, characters:', source.length);
          NODE
          node --check /tmp/photo-scout-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/photoscout-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/photoscout-http.log
          exit 1

      - name: Verify map, fallback, pin workflow and AI generator UI
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const isVectorTile = url => /\.(pbf|mvt)(\?|$)/i.test(url);
          const isRasterTile = url => /tile\.openstreetmap\.org\/.+\.png(?:\?|$)/i.test(url);

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            const pageErrors = [];
            const consoleErrors = [];
            const tileResponses = [];
            let mainFrameNavigations = 0;
            page.on('framenavigated', frame => {
              if (frame === page.mainFrame()) mainFrameNavigations++;
            });
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if(message.type()==='error') consoleErrors.push(message.text());
            });
            page.on('response', response => {
              const url = response.url();
              if (url.includes('openfreemap') || url.includes('openstreetmap.org')) {
                tileResponses.push({ url, status: response.status() });
              }
            });

            try {
              await page.goto('http://127.0.0.1:8000/index.html?v=20261022-calculated-viewpoints-v28', { waitUntil: 'domcontentloaded', timeout: 60000 });
              try {
                await page.waitForFunction(() => !!window.__PHOTO_SCOUT_TEST__?.map, null, { timeout: 15000 });
              } catch (startupError) {
                const startup = await page.evaluate(() => ({
                  title:document.title,
                  readyState:document.readyState,
                  scripts:[...document.scripts].map(s=>({src:s.src,type:s.type,ready:!s.src||s.readyState||'loaded'})),
                  maplibreGlobal:!!window.maplibregl,
                  mapTestHook:!!window.__PHOTO_SCOUT_TEST__,
                  bodyText:(document.body.innerText||'').slice(0,700)
                })).catch(e=>({evaluateError:String(e)}));
                console.log('PHOTO_SCOUT_STARTUP_DIAGNOSTICS '+JSON.stringify({startup,pageErrors,consoleErrors}));
                throw startupError;
              }
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true,
                null,
                { timeout: 50000 }
              );

              // Fresh installation should not trigger a controllerchange reload.
              // A second top-level navigation here is a first-load app-shell race.
              await page.waitForTimeout(800);
              if (mainFrameNavigations > 1) {
                throw new Error('First service-worker control unexpectedly reloaded the page: ' + mainFrameNavigations + ' top-level navigations');
              }

              const appInstallDiagnostics = await page.evaluate(async () => {
                const [manifestResponse, workerResponse] = await Promise.all([
                  fetch('./manifest.webmanifest'),
                  fetch('./sw.js', {cache:'no-store'})
                ]);
                const manifest = manifestResponse.ok ? await manifestResponse.json() : null;
                const workerText = workerResponse.ok ? await workerResponse.text() : '';
                return {
                  manifestStatus: manifestResponse.status,
                  display: manifest && manifest.display,
                  startUrl: manifest && manifest.start_url,
                  workerStatus: workerResponse.status,
                  workerCacheV28: workerText.includes('"photo-scout-shell-v28"'),
                  buildVersion: document.querySelector('meta[name="photo-scout-build"]')?.content||'',
                  installButton: !!document.querySelector('#installAppBtn'),
                  installButtonVisible: !!document.querySelector('#installAppBtn') && !document.querySelector('#installAppBtn').hidden,
                  pinLegend: !!document.querySelector('#mapPinLegend')
                };
              });
              if (appInstallDiagnostics.manifestStatus !== 200 ||
                  appInstallDiagnostics.display !== 'standalone' ||
                  appInstallDiagnostics.workerStatus !== 200 ||
                  !appInstallDiagnostics.workerCacheV28 ||
                  appInstallDiagnostics.buildVersion !== '2026-10-22-photo-scout-calculated-viewpoints-v28' ||
                  !appInstallDiagnostics.installButton || !appInstallDiagnostics.installButtonVisible || !appInstallDiagnostics.pinLegend) {
                throw new Error('Photo Scout must ship as an installable standalone app with a visible pin legend: ' + JSON.stringify(appInstallDiagnostics));
              }

              const initial = await page.evaluate(() => ({
                title: document.title,
                styleLoaded: window.__PHOTO_SCOUT_TEST__.styleLoaded,
                mapLoaded: window.__PHOTO_SCOUT_TEST__.map.loaded(),
                center: window.__PHOTO_SCOUT_TEST__.map.getCenter().toArray(),
                zoom: window.__PHOTO_SCOUT_TEST__.map.getZoom(),
                sources: Object.keys(window.__PHOTO_SCOUT_TEST__.map.getStyle().sources || {}).length
              }));
              if (!initial.styleLoaded || initial.sources < 1) {
                throw new Error('Map style did not become ready: ' + JSON.stringify(initial));
              }

              const waitForTile = async predicate => {
                const deadline = Date.now() + 25000;
                while (Date.now() < deadline) {
                  if (tileResponses.some(item => item.status >= 200 && item.status < 300 && predicate(item.url))) return true;
                  await sleep(200);
                }
                return false;
              };

              const hasVector = await waitForTile(isVectorTile);
              if (!hasVector) {
                const primaryFailures = tileResponses.filter(item => isVectorTile(item.url) && item.status >= 400);
                console.log('PRIMARY_VECTOR_TILE_NOTE ' + JSON.stringify({ successful: false, failed: primaryFailures.slice(0, 5) }));
              }

              // Exercise supported vector-style switching. Never request the public
              // volunteer OSM raster tile endpoint as a fallback.
              await page.evaluate(() => {
                const button=document.querySelector('[data-style="bright"]');
                if(!button)throw new Error('Bright vector style option missing');
                button.click();
              });
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true &&
                      window.__PHOTO_SCOUT_TEST__?.getState().basemapMode !== 'raster',
                null,
                { timeout: 20000 }
              );
              await page.evaluate(() => {
                const button=document.querySelector('[data-style="liberty"]');
                if(button)button.click();
              });
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true &&
                      window.__PHOTO_SCOUT_TEST__?.getState().basemapMode !== 'raster',
                null,
                { timeout: 20000 }
              );
              await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                map.stop();
                map.jumpTo({ center: [14.34873, 45.37306], zoom: 16 });
              });
              await page.waitForTimeout(1200);
              const parkingDiagnostics = await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                const layers = (map.getStyle().layers || []).filter(layer => layer.type === 'symbol').map(layer => ({
                  id: layer.id,
                  source: layer.source || '',
                  sourceLayer: layer['source-layer'] || '',
                  visibility: layer.layout && layer.layout.visibility || 'visible',
                  filter: JSON.stringify(layer.filter || null),
                  iconImage: JSON.stringify(layer.layout && layer.layout['icon-image'] || null)
                })).filter(layer => /poi|park/i.test(layer.id+' '+layer.sourceLayer+' '+layer.iconImage));
                const nativeParkingFeatures = (map.queryRenderedFeatures() || []).filter(feature => {
                  const p = feature.properties || {};
                  return /parking|car_park/i.test([p.class,p.subclass,p.amenity,p.type,p.kind,p.name,p['name:en']].filter(Boolean).join(' '));
                }).map(feature => ({
                  layer: feature.layer && feature.layer.id,
                  source: feature.source,
                  sourceLayer: feature.sourceLayer,
                  properties: feature.properties
                })).slice(0,30);
                return {
                  mode: window.__PHOTO_SCOUT_TEST__.getState().basemapMode,
                  zoom: map.getZoom(),
                  filteredLayerIds: window.__PHOTO_SCOUT_TEST__.getState().parkingLabelLayersFiltered,
                  relevantSymbolLayers: layers,
                  nativeParkingFeatures,
                  scoutParkingMarkers: window.__PHOTO_SCOUT_TEST__.getState().visibleParkingMarkerClasses
                };
              });
              console.log('PARKING_DIAGNOSTICS '+JSON.stringify(parkingDiagnostics));
              if (parkingDiagnostics.nativeParkingFeatures.length > 0) {
                throw new Error('The basemap still renders native parking labels in addition to Photo Scout markers: '+JSON.stringify(parkingDiagnostics.nativeParkingFeatures));
              }

              // Use a real map click at the Rijeka-area coordinate, not a mocked event.
              const point = await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                const container = map.getContainer();
                const box = container.getBoundingClientRect();
                const canvas = container.querySelector('canvas.maplibregl-canvas');
                const canvasContainer = container.querySelector('.maplibregl-canvas-container');
                if (!canvas || !canvasContainer) return {emptyMapPatch:false,reason:'no MapLibre canvas surface'};
                const canvasBox = canvas.getBoundingClientRect();
                const base = map.project([14.34873, 45.37306]);
                const offsets=[];
                for(let ring=0;ring<8;ring++){
                  const r=ring*44;
                  offsets.push([r,0],[-r,0],[0,r],[0,-r],[r,r],[-r,r],[r,-r],[-r,-r]);
                }
                const candidates=offsets.map(([dx,dy])=>({x:box.left+base.x+dx,y:box.top+base.y+dy}))
                  .concat(Array.from({length:72},(_,i)=>({
                    x:canvasBox.left+50+((i*173)%(Math.max(1,Math.floor(canvasBox.width-100)))),
                    y:canvasBox.top+50+((i*97)%(Math.max(1,Math.floor(canvasBox.height-100))))
                  })));
                for(const p of candidates){
                  if(p.x<canvasBox.left+12||p.x>canvasBox.right-12||p.y<canvasBox.top+12||p.y>canvasBox.bottom-12)continue;
                  const hit=document.elementFromPoint(p.x,p.y);
                  if(hit===canvas||hit===canvasContainer||canvasContainer.contains(hit)){
                    const ll=map.unproject([p.x-box.left,p.y-box.top]).toArray();
                    return {x:p.x,y:p.y,width:window.innerWidth,height:window.innerHeight,lngLat:ll,emptyMapPatch:true};
                  }
                }
                return {x:base.x+box.left,y:base.y+box.top,width:window.innerWidth,height:window.innerHeight,emptyMapPatch:false,reason:'no unobstructed point on MapLibre surface'};
              });
              if (!point.emptyMapPatch) {
                throw new Error('Could not find an unobstructed point on the live map surface: ' + JSON.stringify(point));
              }
              const scanStartedAt = Date.now();
              const scansBeforeClick = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.scanCount);
              await page.mouse.click(point.x, point.y);
              await page.waitForFunction((previousCount) =>
                window.__PHOTO_SCOUT_TEST__?.scanCount > previousCount &&
                document.querySelector('#spotDetail')?.classList.contains('show'),
                scansBeforeClick,
                { timeout: 10000 }
              );

              // The chosen point should remain selected and the camera should not
              // jump again when asynchronous nearby-place/photo requests finish.
              await page.waitForFunction(() => {
                const test = window.__PHOTO_SCOUT_TEST__;
                return !!test && !test.map.isMoving() && test.getState().scanPending === true;
              }, null, { timeout: 15000 });
              const cameraAtSelectedPin = await page.evaluate(() => {
                const test = window.__PHOTO_SCOUT_TEST__;
                return {
                  center: test.map.getCenter().toArray(),
                  zoom: test.map.getZoom(),
                  activeCenter: test.getState().activeCenter,
                  selectedCoordinate: test.getState().selectedCoordinate
                };
              });
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.getState().scanPending === false,
                null,
                { timeout: 90000 }
              );
              const scanReadyElapsedMs = Date.now() - scanStartedAt;
              if (scanReadyElapsedMs > 8500) {
                throw new Error('Photo Scout should make the map interactive without waiting for optional geography searches: ' + scanReadyElapsedMs + 'ms');
              }
              console.log('FAST_MAP_READY_MS ' + scanReadyElapsedMs);

              // The shell is deliberately interactive before optional place-data APIs return.
              // Wait for those background requests before asserting result pins; scanPending is
              // cleared after the fast UI deadline and is not the same as data-source completion.
              await page.waitForFunction(() => {
                const test=window.__PHOTO_SCOUT_TEST__;
                if(!test)return false;
                const state=test.getState();
                return state.resultCount>0 || state.scenicCount>0 ||
                  /No nearby features returned|Partial results loaded|Map ready · partial results/i.test(document.querySelector('#statusTitle')?.textContent||'');
              }, null, { timeout: 45000 }).catch(error=>{
                throw new Error('Nearby place and scenic data did not arrive after the pin was set: '+JSON.stringify(window.__PHOTO_SCOUT_TEST__?.getState?.()||{})+' · '+(document.querySelector('#statusTitle')?.textContent||'')+' · '+(document.querySelector('#statusMsg')?.textContent||''));
              });

              await page.waitForFunction(
                 () => window.__PHOTO_SCOUT_TEST__?.getState().cameraCalculationPending === false,
                 null, { timeout: 60000 }
               ).catch(error => {
                 throw new Error('Calculated viewpoint search did not finish after the map click: '+
                   JSON.stringify(window.__PHOTO_SCOUT_TEST__?.getState?.()||{}));
               });

               // Validate real returned place records, not only the synthetic marker fixture.
              const livePinDiagnostics = await page.evaluate(() => {
                const test=window.__PHOTO_SCOUT_TEST__;
                const state=test.getState();
                const container=test.map.getContainer();
                const mapBox=container.getBoundingClientRect();
                const canvas=container.querySelector('canvas.maplibregl-canvas');
                const canvasBox=canvas&&canvas.getBoundingClientRect();
                const nodes=[...document.querySelectorAll('.scout-marker')];
                const domCounts={
                  landmark:nodes.filter(n=>n.classList.contains('history')).length,
                  architecture:nodes.filter(n=>n.classList.contains('architecture')).length,
                  viewpoint:nodes.filter(n=>n.classList.contains('viewpoint')).length,
                  photoSpot:nodes.filter(n=>n.classList.contains('photoSpot')).length,
                  inferredViewpoint:nodes.filter(n=>n.classList.contains('inferred-viewpoint-pin')).length,
                  parking:nodes.filter(n=>n.classList.contains('parking')).length,
                  visibleNameLabels:nodes.filter(n=>n.classList.contains('show-pin-label')).length
                };
                return {
                  viewport:{width:innerWidth,height:innerHeight},
                  mapBox:{x:mapBox.x,y:mapBox.y,width:mapBox.width,height:mapBox.height},
                  canvasBox:canvasBox&&{x:canvasBox.x,y:canvasBox.y,width:canvasBox.width,height:canvasBox.height},
                  mapReady:state.styleLoaded,scanCount:state.scanCount,scanPending:state.scanPending,
                  resultCount:state.resultCount,dataInView:state.viewportCategoryCounts||{},
                  cameraCalculationPending:state.cameraCalculationPending,cameraRoadCandidateCount:state.cameraRoadCandidateCount,assumedViewpointCount:state.assumedViewpointCount,
                  markerCounts:state.markerCounts||{},domCounts,
                  legendButtons:document.querySelectorAll('[data-marker-filter]').length,
                  legendSummary:document.querySelector('#mapPinSummary')?.textContent||''
                };
              });
              console.log('LIVE_PIN_DIAGNOSTICS '+JSON.stringify(livePinDiagnostics));
              if(livePinDiagnostics.cameraCalculationPending ||
                 (livePinDiagnostics.cameraRoadCandidateCount>0&&livePinDiagnostics.assumedViewpointCount<1)) {
                throw new Error('Mapped paths were returned but no calculated camera position was produced: '+JSON.stringify(livePinDiagnostics));
              }
              const markerStability = await page.evaluate(() =>
                window.__PHOTO_SCOUT_TEST__.runMarkerStabilityFixture()
              );
              console.log('MARKER_STABILITY_FIXTURE ' + JSON.stringify(markerStability));
              if (!markerStability.sameDomNodes || !markerStability.signatureStable ||
                  !markerStability.markerCountMatchesState || !markerStability.activePinRemainsIndependent ||
                  markerStability.maxIconCenterErrorPx > 2) {
                throw new Error('Unchanged map idle renders must reuse marker DOM nodes: ' + JSON.stringify(markerStability));
              }
              if(!livePinDiagnostics.mapReady || livePinDiagnostics.legendButtons!==6) {
                throw new Error('The map must expose six interactive pin layers: '+JSON.stringify(livePinDiagnostics));
              }
              if(!livePinDiagnostics.mapBox || livePinDiagnostics.mapBox.width<livePinDiagnostics.viewport.width*.95 ||
                 !livePinDiagnostics.canvasBox || livePinDiagnostics.canvasBox.width<livePinDiagnostics.viewport.width*.95) {
                throw new Error('The map canvas must use the full viewport width: '+JSON.stringify(livePinDiagnostics));
              }
              if(livePinDiagnostics.domCounts.landmark+livePinDiagnostics.domCounts.architecture+
                 livePinDiagnostics.domCounts.viewpoint+livePinDiagnostics.domCounts.photoSpot+livePinDiagnostics.domCounts.inferredViewpoint===0) {
                throw new Error('The real scan produced no visible landmark, building, viewpoint or photo-spot pins: '+JSON.stringify(livePinDiagnostics));
              }
              const missingPinForRealResult=
                (livePinDiagnostics.dataInView.history>0&&livePinDiagnostics.domCounts.landmark===0)||
                (livePinDiagnostics.dataInView.architecture>0&&livePinDiagnostics.domCounts.architecture===0)||
                (livePinDiagnostics.dataInView.viewpoint>0&&livePinDiagnostics.domCounts.viewpoint===0)||
                (livePinDiagnostics.dataInView.scenic>0&&livePinDiagnostics.domCounts.photoSpot===0)||
                 (livePinDiagnostics.dataInView.inferredViewpoint>0&&livePinDiagnostics.domCounts.inferredViewpoint===0);
              if(missingPinForRealResult) {
                throw new Error('Real in-view geographic records are missing matching visible pins: '+JSON.stringify(livePinDiagnostics));
              }

              await page.waitForTimeout(350);
              const cameraAfterScan = await page.evaluate(() => {
                const test = window.__PHOTO_SCOUT_TEST__;
                return {
                  center: test.map.getCenter().toArray(),
                  zoom: test.map.getZoom(),
                  activeCenter: test.getState().activeCenter,
                  selectedCoordinate: test.getState().selectedCoordinate
                };
              });
              const centerDrift = Math.hypot(
                cameraAtSelectedPin.center[0] - cameraAfterScan.center[0],
                cameraAtSelectedPin.center[1] - cameraAfterScan.center[1]
              );
              const zoomDrift = Math.abs(cameraAtSelectedPin.zoom - cameraAfterScan.zoom);
              const pinDrift = cameraAfterScan.activeCenter && cameraAfterScan.selectedCoordinate
                ? Math.hypot(
                    cameraAfterScan.activeCenter.lng - cameraAfterScan.selectedCoordinate.lng,
                    cameraAfterScan.activeCenter.lat - cameraAfterScan.selectedCoordinate.lat
                  )
                : Infinity;
              if (centerDrift > 0.00001 || zoomDrift > 0.02 || pinDrift > 0.00001) {
                throw new Error('Selected map pin/camera changed after scan completion: ' + JSON.stringify({
                  cameraAtSelectedPin, cameraAfterScan, centerDrift, zoomDrift, pinDrift
                }));
              }
              console.log('PIN_CAMERA_STABILITY ' + JSON.stringify({
                centerDrift, zoomDrift, pinDrift, cameraAtSelectedPin, cameraAfterScan
              }));

              const pinState = await page.evaluate(() => ({
                state: window.__PHOTO_SCOUT_TEST__.getState(),
                sketch: document.querySelector('#selectedLocalSketch')?.getAttribute('src') || '',
                generatorButton: !!document.querySelector('#generateAIConcept'),
                selectedGeneratorButton: !!document.querySelector('#selectedGenerateAI'),
                selectedGeneratorVisible: !!document.querySelector('#selectedGenerateAI') &&
                  document.querySelector('#selectedGenerateAI').getBoundingClientRect().height > 0,
                generatorPanel: !!document.querySelector('#aiImageGenerator'),
                settings: !!document.querySelector('#aiImageSettings'),
                mapIssueVisible: document.querySelector('#mapIssue')?.classList.contains('show')
              }));
              if (!pinState.state.activeCenter || !pinState.state.selectedId ||
                  !pinState.sketch.startsWith('data:image/svg+xml') ||
                  !pinState.generatorButton || !pinState.selectedGeneratorButton ||
                  !pinState.selectedGeneratorVisible || !pinState.generatorPanel || !pinState.settings) {
                throw new Error('A map click must select a pin and show its location-specific photography workflow: ' + JSON.stringify(pinState));
              }
              const quickActions = await page.evaluate(() => ({
                visible: document.querySelector('#pinActionStrip') && !document.querySelector('#pinActionStrip').hidden,
                ideas: document.querySelectorAll('#selectedIdeaSketches .selected-idea-sketch').length,
                quickSketches: document.querySelectorAll('#pinActionSketches .pin-action-sketch').length,
                pinBoardVisible: !!document.querySelector('#pinIdeaBoard') && !document.querySelector('#pinIdeaBoard').hidden,
                pinBoardSketches: document.querySelectorAll('#pinIdeaSketchGrid .pin-idea-sketch').length,
                pinBoardHasGenerator: !!document.querySelector('#pinIdeaBoard #aiImageGenerator'),
                pinBoardHasReferences: !!document.querySelector('#pinIdeaBoard #pinIdeaReferenceGrid'),
                aiButton: !!document.querySelector('#quickGenerateAI'),
                topBoardAIButton: !!document.querySelector('#pinBoardGenerateAI') &&
                  document.querySelector('#pinBoardGenerateAI').getBoundingClientRect().height > 0,
                label: document.querySelector('#pinActionTitle')?.textContent
              }));
              if (!quickActions.visible || quickActions.ideas !== 3 || quickActions.quickSketches !== 3 || !quickActions.aiButton ||
                  !quickActions.pinBoardVisible || quickActions.pinBoardSketches !== 3 ||
                  !quickActions.pinBoardHasGenerator || !quickActions.pinBoardHasReferences || !quickActions.topBoardAIButton) {
                throw new Error('Pin-first board must expose three camera sketches, reference photos and AI generation directly after a map click: '+JSON.stringify(quickActions));
              }

              const parkingEntranceFixture = await page.evaluate(() =>
                window.__PHOTO_SCOUT_TEST__.runParkingEntranceFixture()
              );
              if (!parkingEntranceFixture.entranceCasesRecognized ||
                  !parkingEntranceFixture.ordinaryLotsNotCalledEntrances) {
                throw new Error('Parking entrances must be distinguished from lot-centre points: ' + JSON.stringify(parkingEntranceFixture));
              }
              const mapRoleFixture = await page.evaluate(() =>
                window.__PHOTO_SCOUT_TEST__.runMapRoleFixture()
              );
              if (!mapRoleFixture.explicitlyMappedViewpointAccepted ||
                  !mapRoleFixture.namedLookoutAccepted ||
                  !mapRoleFixture.genericHillNotTreatedAsVisitorViewpoint ||
                  !mapRoleFixture.repeatedGenericMemorialNotLabelled ||
                  !mapRoleFixture.namedHistoricPlaceCanBeLabelled) {
                throw new Error('Mapped viewpoints, targeted vantage points and sparse landmark labels regressed: ' + JSON.stringify(mapRoleFixture));
              }
              console.log('MAP_ROLE_AND_LABEL_FIXTURE ' + JSON.stringify(mapRoleFixture));
              if (!mapRoleFixture.memorialTagsRecognized || !mapRoleFixture.waysideCrossRecognized ||
                  !mapRoleFixture.plaqueRecognized || !mapRoleFixture.fountainRecognized ||
                  !mapRoleFixture.distinctNearbyMemorialsKept || !mapRoleFixture.legacyGenericMemorialsKept ||
                  !mapRoleFixture.mappedGenericRecordsStaySeparate || !mapRoleFixture.exactSameGenericCoordinateDeduplicated ||
                  !mapRoleFixture.distinctSameNameOsmNodesKept || !mapRoleFixture.namedNodePreferredToApproximateAreaCenter ||
                  !mapRoleFixture.buildingOutlineCentroidPreferredToPoiNode ||
                  !mapRoleFixture.explicitMemorialNodePreferredToAreaCentroid ||
                  !mapRoleFixture.polygonCentroidDiffersFromBoundingBoxCenter ||
                  !mapRoleFixture.broadHistoricTagRecognized || !mapRoleFixture.darkStyleExcludedFromFallback) {
                throw new Error('Small local-interest subjects must be retained without collapsing distinct nearby memorials: ' + JSON.stringify(mapRoleFixture));
              }

              // Diagnostic only: Openverse is anonymous but rate limited. The app
              // retains Wikimedia Commons and in-app sketches if the service is unavailable.
              const openverseProbe = await page.evaluate(async () => {
                try {
                  const response = await fetch('https://api.openverse.org/v1/images/?q=Kastav%20Croatia&page_size=3&license_type=commercial&filter_dead=true&mature=false');
                  const data = response.ok ? await response.json() : null;
                  return {status:response.status, resultCount:data?.results?.length ?? null,
                    shapeOK:!!data && Array.isArray(data.results) &&
                      (!data.results.length || !!(data.results[0].thumbnail && data.results[0].foreign_landing_url && data.results[0].license))};
                } catch(error) { return {status:0,error:String(error&&error.message||error)}; }
              });
              console.log('OPENVERSE_REFERENCE_PROBE '+JSON.stringify(openverseProbe));
              const calculatedViewpointFixture = await page.evaluate(() =>
                window.__PHOTO_SCOUT_TEST__.runCalculatedViewpointFixture()
              );
              if (!calculatedViewpointFixture.pedestrianRoutePreferred ||
                  !calculatedViewpointFixture.privateAccessRejected ||
                  !calculatedViewpointFixture.cameraLensChangesWithDistance ||
                  !calculatedViewpointFixture.clearTerrainRayRecognized ||
                  !calculatedViewpointFixture.blockingTerrainRecognized ||
                  !calculatedViewpointFixture.missingTerrainRemainsUnverified ||
                  !calculatedViewpointFixture.bearingHasCompassDirection) {
                throw new Error('Calculated Viewpoint regression: ' + JSON.stringify(calculatedViewpointFixture));
              }
              console.log('CALCULATED_VIEWPOINT_FIXTURE '+JSON.stringify(calculatedViewpointFixture));
              const contextualPhotoFixtures = await page.evaluate(() =>
                window.__PHOTO_SCOUT_TEST__.runContextPhotoRegressionFixtures()
              );
              if (!contextualPhotoFixtures.nearSubjectRetained ||
                  !contextualPhotoFixtures.distantSubjectRejected ||
                  !contextualPhotoFixtures.washingtonPhotoRejected ||
                  !contextualPhotoFixtures.kastavPhotoAccepted ||
                  !contextualPhotoFixtures.shotIdeasPerSubject ||
                  !contextualPhotoFixtures.sketchPerSubject) {
                throw new Error('Contextual Photo Ideas regression: ' + JSON.stringify(contextualPhotoFixtures));
              }
              console.log('CONTEXTUAL_PHOTO_IDEAS_REGRESSION ' + JSON.stringify(contextualPhotoFixtures));
              const dismissal = await page.evaluate(() => {
                const beforeToken = window.__PHOTO_SCOUT_TEST__.getState().scanCount;
                document.querySelector('#fieldGuidePage').hidden = false;
                document.body.classList.add('field-guide-open', 'field-guide-context-only');
                document.querySelector('#fieldGuideClose').click();
                return {
                  boardHidden: document.querySelector('#fieldGuidePage').hidden,
                  contextClassRemoved: !document.body.classList.contains('field-guide-context-only'),
                  boardClassRemoved: !document.body.classList.contains('field-guide-open'),
                  scanCountUnchanged: window.__PHOTO_SCOUT_TEST__.getState().scanCount === beforeToken
                };
              });
              if (!dismissal.boardHidden || !dismissal.contextClassRemoved || !dismissal.boardClassRemoved || !dismissal.scanCountUnchanged) {
                throw new Error('Closing contextual ideas must restore the map without re-scanning or stale UI: ' + JSON.stringify(dismissal));
              }
              console.log('CONTEXTUAL_PHOTO_IDEAS_DISMISSAL ' + JSON.stringify(dismissal));


              const markerFixture = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.renderMarkerFixture());
              if (markerFixture.landmark < 1 || markerFixture.architecture < 1 ||
                  markerFixture.viewpoint < 1 || markerFixture.photoSpot < 1 ||
                  markerFixture.parking < 1 || markerFixture.inferredViewpoint < 1 || markerFixture.inferredIcon < 1 || markerFixture.svgIcons < 3 ||
                  !markerFixture.exactCoordinates || !markerFixture.zeroOffsets) {
                throw new Error('Map feature markers must remain on their exact geographic coordinates with no visual offsets: ' + JSON.stringify(markerFixture));
              }

              // Mock only the image provider response in CI; don't consume generation credits.
              await page.evaluate(() => {
                window.__photoScoutTestPrompt = '';
                window.puter = { ai: { txt2img: async (prompt, options) => {
                  window.__photoScoutTestPrompt = prompt;
                  window.__photoScoutTestOptions = options;
                  return { src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#2a4551"/><stop offset="1" stop-color="#e1bc8a"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sky)"/><circle cx="980" cy="140" r="62" fill="#fff0c2"/><path d="M0 440L210 280 390 410 620 210 820 400 1040 255 1280 425V720H0Z" fill="#7e958a"/><path d="M0 530L180 470 390 510 580 410 760 505 995 420 1280 510V720H0Z" fill="#2c473a"/></svg>'
                  ) };
                } } };
              });
              await page.locator('#generateAIConcept').click();
              await page.waitForFunction(
                () => !document.querySelector('#aiImageResult')?.hidden &&
                      (document.querySelector('#aiImageOutput')?.getAttribute('src') || '').startsWith('data:image/svg+xml'),
                null,
                { timeout: 10000 }
              );
              const imageGenerationUI = await page.evaluate(() => ({
                visible: !document.querySelector('#aiImageResult')?.hidden,
                src: document.querySelector('#aiImageOutput')?.getAttribute('src') || '',
                status: document.querySelector('#aiImageStatus')?.textContent || '',
                prompt: window.__photoScoutTestPrompt || '',
                usesCanon: /Canon EOS R50/.test(window.__photoScoutTestPrompt || ''),
                usesLocation: (window.__photoScoutTestPrompt || '').includes(document.querySelector('#detailTitle')?.textContent || '')
              }));
              if(!imageGenerationUI.visible || !imageGenerationUI.src.startsWith('data:image/') ||
                 !imageGenerationUI.usesCanon || !imageGenerationUI.usesLocation) {
                throw new Error('Image-generation preview was not created for the selected place and camera: '+JSON.stringify(imageGenerationUI));
              }

              // Let the independent source-photo lookup finish; capture the real
              // gallery result separately from the mocked image-generation result.
              const photoSearchSettled = await page.waitForFunction(
                () => {
                  const count = document.querySelector('#detailPhotoCount')?.textContent || '';
                  return !!count && !/searching|looking up|finding landmark/i.test(count);
                },
                null,
                { timeout: 25000 }
              ).then(() => true).catch(() => false);
              const photoReferenceDiagnostics = await page.evaluate(() => ({
                status: document.querySelector('#detailPhotoCount')?.textContent || '',
                titles: [...document.querySelectorAll('#detailPhotoRefs .detail-photo-title')].map(x => x.textContent || ''),
                sourceCards: document.querySelectorAll('#detailPhotoRefs .detail-photo').length,
                sketchCards: document.querySelectorAll('#selectedIdeaSketches .selected-idea-sketch').length,
                aiImageVisible: !document.querySelector('#aiImageResult')?.hidden
              }));
              const badPhotoTitle = /(event|festival|concert|tournament|championship|competition|match|team|players?|skatehockey|football|soccer|basketball|volleyball|hockey|marathon|race|wedding|birthday|graduation|crowd|spectators?|audience|selfie|portrait|headshot|family|children|athletes?|school class|group photo|u(?:1[0-9]|2[0-3])\\b|award ceremony|celebration|party|conference|meeting|demonstration|protest)/i;
              if(photoReferenceDiagnostics.titles.some(title => badPhotoTitle.test(title))) {
                throw new Error('Unrelated event/person photos appeared in the selected-spot gallery: '+JSON.stringify(photoReferenceDiagnostics));
              }
              if(photoReferenceDiagnostics.sketchCards !== 3 || !photoReferenceDiagnostics.aiImageVisible) {
                throw new Error('The no-photo fallback must retain three shot sketches and the generated concept: '+JSON.stringify(photoReferenceDiagnostics));
              }

              // Check the selected parking destinations carry human-readable distance
              // labels at close zoom, so map markers correlate with the parking list.
              await page.evaluate(() => {
                const test = window.__PHOTO_SCOUT_TEST__;
                const map = test.map;
                const center = test.getState().activeCenter;
                if(center) map.jumpTo({center:[center.lng,center.lat],zoom:16});
              });
              await page.waitForTimeout(600);
              const parkingDistanceDiagnostics = await page.evaluate(() => {
                const markers = [...document.querySelectorAll('.scout-marker.parking:not(.parking-cluster)')];
                return {
                  count: markers.length,
                  withDistance: markers.filter(m => !!m.getAttribute('data-distance')).length,
                  sample: markers.slice(0,8).map(m=>({title:m.title,distance:m.getAttribute('data-distance')}))
                };
              });
              if(parkingDistanceDiagnostics.count > 0 && parkingDistanceDiagnostics.withDistance === 0) {
                throw new Error('Close-zoom parking markers have no distance labels: '+JSON.stringify(parkingDistanceDiagnostics));
              }

              const distanceDiagnostics = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.getState().distanceDiagnostics || []);
              const inaccurateDistances = distanceDiagnostics.filter(item => item.delta > 2);
              if (inaccurateDistances.length) {
                throw new Error('Displayed search distances disagree with the actual coordinates: ' + JSON.stringify(inaccurateDistances.slice(0,5)));
              }
              const localityConflictDiagnostics = await page.evaluate(() => {
                const state = window.__PHOTO_SCOUT_TEST__.getState();
                const excluded = state.locationConflictExclusions || [];
                const visibleNames = [...document.querySelectorAll('.spot-card .spot-title')].map(node => node.textContent || '');
                return {
                  excluded,
                  exclusionLeak: excluded.filter(item => visibleNames.includes(item.name)),
                  dominantLocality: state.detectedLocality
                };
              });
              if (localityConflictDiagnostics.exclusionLeak.length) {
                throw new Error('A feature with a conflicting named locality still appears as a nearby candidate: ' + JSON.stringify(localityConflictDiagnostics));
              }

              await page.screenshot({ path: 'artifacts/photo-scout-live-map.png', fullPage: false });
              if (pageErrors.length) throw new Error('Browser runtime exceptions: ' + JSON.stringify(pageErrors));
              console.log('PHOTO_SCOUT_CHECKS ' + JSON.stringify({
                initial,
                primaryVectorTilesLoaded: hasVector,
                backupRasterTilesLoaded: tileResponses.some(item => isRasterTile(item.url) && item.status >= 200 && item.status < 300),
                pinWorkflow: 'passed',
                pinState,
                quickActions,
                appInstallDiagnostics,
                markerFixture,
                imageGenerationUI: {...imageGenerationUI,prompt:imageGenerationUI.prompt.slice(0,500)},
                photoSearchSettled,
                photoReferenceDiagnostics,
                parkingDistanceDiagnostics,
                distanceDiagnostics,
                localityConflictDiagnostics,
                parkingDiagnostics,
                browserExceptions: pageErrors,
                tileResponsesObserved: tileResponses.length
              }));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-scout-live-map
          path: artifacts/photo-scout-live-map.png
          if-no-files-found: ignore
