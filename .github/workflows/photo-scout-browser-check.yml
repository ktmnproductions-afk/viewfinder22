name: Photo Scout browser verification

on:
  push:
    branches:
      - main
      - "assistant/**"
    paths:
      - "index.html"
      - ".github/workflows/photo-scout-browser-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/photo-scout-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/photoscout-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/photoscout-http.log
          exit 1

      - name: Verify map, fallback, pin workflow and AI generator UI
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const isVectorTile = url => /\.(pbf|mvt)(\?|$)/i.test(url);
          const isRasterTile = url => /tile\.openstreetmap\.org\/.+\.png(?:\?|$)/i.test(url);

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            const pageErrors = [];
            const tileResponses = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('response', response => {
              const url = response.url();
              if (url.includes('openfreemap') || url.includes('openstreetmap.org')) {
                tileResponses.push({ url, status: response.status() });
              }
            });

            try {
              await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => !!window.__PHOTO_SCOUT_TEST__?.map, null, { timeout: 15000 });
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true,
                null,
                { timeout: 50000 }
              );

              const appInstallDiagnostics = await page.evaluate(async () => {
                const [manifestResponse, workerResponse] = await Promise.all([
                  fetch('./manifest.webmanifest'),
                  fetch('./sw.js')
                ]);
                const manifest = manifestResponse.ok ? await manifestResponse.json() : null;
                return {
                  manifestStatus: manifestResponse.status,
                  display: manifest && manifest.display,
                  startUrl: manifest && manifest.start_url,
                  workerStatus: workerResponse.status,
                  installButton: !!document.querySelector('#installAppBtn'),
                  pinLegend: !!document.querySelector('#mapPinLegend')
                };
              });
              if (appInstallDiagnostics.manifestStatus !== 200 ||
                  appInstallDiagnostics.display !== 'standalone' ||
                  appInstallDiagnostics.workerStatus !== 200 ||
                  !appInstallDiagnostics.installButton || !appInstallDiagnostics.pinLegend) {
                throw new Error('Photo Scout must ship as an installable standalone app with a visible pin legend: ' + JSON.stringify(appInstallDiagnostics));
              }

              const initial = await page.evaluate(() => ({
                title: document.title,
                styleLoaded: window.__PHOTO_SCOUT_TEST__.styleLoaded,
                mapLoaded: window.__PHOTO_SCOUT_TEST__.map.loaded(),
                center: window.__PHOTO_SCOUT_TEST__.map.getCenter().toArray(),
                zoom: window.__PHOTO_SCOUT_TEST__.map.getZoom(),
                sources: Object.keys(window.__PHOTO_SCOUT_TEST__.map.getStyle().sources || {}).length
              }));
              if (!initial.styleLoaded || initial.sources < 1) {
                throw new Error('Map style did not become ready: ' + JSON.stringify(initial));
              }

              const waitForTile = async predicate => {
                const deadline = Date.now() + 25000;
                while (Date.now() < deadline) {
                  if (tileResponses.some(item => item.status >= 200 && item.status < 300 && predicate(item.url))) return true;
                  await sleep(200);
                }
                return false;
              };

              const hasVector = await waitForTile(isVectorTile);
              if (!hasVector) {
                const primaryFailures = tileResponses.filter(item => isVectorTile(item.url) && item.status >= 400);
                console.log('PRIMARY_VECTOR_TILE_NOTE ' + JSON.stringify({ successful: false, failed: primaryFailures.slice(0, 5) }));
              }

              // Exercise the backup pathway, then return to the vector map for parking-layer checks.
              await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.forceRasterFallback());
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true &&
                      window.__PHOTO_SCOUT_TEST__?.getState().basemapMode === 'raster',
                null,
                { timeout: 15000 }
              );
              const rasterLoaded = await waitForTile(isRasterTile);
              if (!rasterLoaded) {
                throw new Error('Backup OpenStreetMap raster tiles did not return a successful response: ' +
                  JSON.stringify(tileResponses.filter(item => isRasterTile(item.url)).slice(0, 8)));
              }

              await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.retryVectorBasemap());
              await page.waitForFunction(
                () => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true &&
                      window.__PHOTO_SCOUT_TEST__?.getState().basemapMode !== 'raster',
                null,
                { timeout: 20000 }
              );
              await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                map.stop();
                map.jumpTo({ center: [14.34873, 45.37306], zoom: 16 });
              });
              await page.waitForTimeout(1200);
              const parkingDiagnostics = await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                const layers = (map.getStyle().layers || []).filter(layer => layer.type === 'symbol').map(layer => ({
                  id: layer.id,
                  source: layer.source || '',
                  sourceLayer: layer['source-layer'] || '',
                  visibility: layer.layout && layer.layout.visibility || 'visible',
                  filter: JSON.stringify(layer.filter || null),
                  iconImage: JSON.stringify(layer.layout && layer.layout['icon-image'] || null)
                })).filter(layer => /poi|park/i.test(layer.id+' '+layer.sourceLayer+' '+layer.iconImage));
                const nativeParkingFeatures = (map.queryRenderedFeatures() || []).filter(feature => {
                  const p = feature.properties || {};
                  return /parking|car_park/i.test([p.class,p.subclass,p.amenity,p.type,p.kind,p.name,p['name:en']].filter(Boolean).join(' '));
                }).map(feature => ({
                  layer: feature.layer && feature.layer.id,
                  source: feature.source,
                  sourceLayer: feature.sourceLayer,
                  properties: feature.properties
                })).slice(0,30);
                return {
                  mode: window.__PHOTO_SCOUT_TEST__.getState().basemapMode,
                  zoom: map.getZoom(),
                  filteredLayerIds: window.__PHOTO_SCOUT_TEST__.getState().parkingLabelLayersFiltered,
                  relevantSymbolLayers: layers,
                  nativeParkingFeatures,
                  scoutParkingMarkers: window.__PHOTO_SCOUT_TEST__.getState().visibleParkingMarkerClasses
                };
              });
              console.log('PARKING_DIAGNOSTICS '+JSON.stringify(parkingDiagnostics));
              if (parkingDiagnostics.nativeParkingFeatures.length > 0) {
                throw new Error('The basemap still renders native parking labels in addition to Photo Scout markers: '+JSON.stringify(parkingDiagnostics.nativeParkingFeatures));
              }

              // Use a real map click at the Rijeka-area coordinate, not a mocked event.
              const point = await page.evaluate(() => {
                const map = window.__PHOTO_SCOUT_TEST__.map;
                const p = map.project([14.34873, 45.37306]);
                return { x: p.x, y: p.y, width: map.getContainer().clientWidth, height: map.getContainer().clientHeight };
              });
              if (point.x < 340 || point.x > point.width || point.y < 95 || point.y > point.height) {
                throw new Error('Test coordinate projected outside the clickable visible map: ' + JSON.stringify(point));
              }
              const scansBeforeClick = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.scanCount);
              await page.mouse.click(point.x, point.y);
              await page.waitForFunction((previousCount) =>
                window.__PHOTO_SCOUT_TEST__?.scanCount > previousCount &&
                document.querySelector('#spotDetail')?.classList.contains('show'),
                scansBeforeClick,
                { timeout: 10000 }
              );

              const pinState = await page.evaluate(() => ({
                state: window.__PHOTO_SCOUT_TEST__.getState(),
                sketch: document.querySelector('#selectedLocalSketch')?.getAttribute('src') || '',
                generatorButton: !!document.querySelector('#generateAIConcept'),
                generatorPanel: !!document.querySelector('#aiImageGenerator'),
                settings: !!document.querySelector('#aiImageSettings'),
                mapIssueVisible: document.querySelector('#mapIssue')?.classList.contains('show')
              }));
              if (!pinState.state.activeCenter || !pinState.state.selectedId ||
                  !pinState.sketch.startsWith('data:image/svg+xml') ||
                  !pinState.generatorButton || !pinState.generatorPanel || !pinState.settings) {
                throw new Error('A map click must select a pin and show its location-specific photography workflow: ' + JSON.stringify(pinState));
              }
              const quickActions = await page.evaluate(() => ({
                visible: document.querySelector('#pinActionStrip') && !document.querySelector('#pinActionStrip').hidden,
                ideas: document.querySelectorAll('#selectedIdeaSketches .selected-idea-sketch').length,
                aiButton: !!document.querySelector('#quickGenerateAI'),
                label: document.querySelector('#pinActionTitle')?.textContent
              }));
              if (!quickActions.visible || quickActions.ideas !== 3 || !quickActions.aiButton) {
                throw new Error('Pin action strip or three camera sketches are missing: '+JSON.stringify(quickActions));
              }

              const markerFixture = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.renderMarkerFixture());
              if (markerFixture.landmark < 1 || markerFixture.architecture < 1 ||
                  markerFixture.viewpoint < 1 || markerFixture.photoSpot < 1 ||
                  markerFixture.parking < 1 || markerFixture.svgIcons < 3) {
                throw new Error('Landmark, architecture, viewpoint, photo-spot and parking pins must all render as distinct icon markers: ' + JSON.stringify(markerFixture));
              }

              // Mock only the image provider response in CI; don't consume generation credits.
              await page.evaluate(() => {
                window.__photoScoutTestPrompt = '';
                window.puter = { ai: { txt2img: async (prompt, options) => {
                  window.__photoScoutTestPrompt = prompt;
                  window.__photoScoutTestOptions = options;
                  return { src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#2a4551"/><stop offset="1" stop-color="#e1bc8a"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sky)"/><circle cx="980" cy="140" r="62" fill="#fff0c2"/><path d="M0 440L210 280 390 410 620 210 820 400 1040 255 1280 425V720H0Z" fill="#7e958a"/><path d="M0 530L180 470 390 510 580 410 760 505 995 420 1280 510V720H0Z" fill="#2c473a"/></svg>'
                  ) };
                } } };
              });
              await page.locator('#generateAIConcept').click();
              await page.waitForFunction(
                () => !document.querySelector('#aiImageResult')?.hidden &&
                      (document.querySelector('#aiImageOutput')?.getAttribute('src') || '').startsWith('data:image/svg+xml'),
                null,
                { timeout: 10000 }
              );
              const imageGenerationUI = await page.evaluate(() => ({
                visible: !document.querySelector('#aiImageResult')?.hidden,
                src: document.querySelector('#aiImageOutput')?.getAttribute('src') || '',
                status: document.querySelector('#aiImageStatus')?.textContent || '',
                prompt: window.__photoScoutTestPrompt || '',
                usesCanon: /Canon EOS R50/.test(window.__photoScoutTestPrompt || ''),
                usesLocation: (window.__photoScoutTestPrompt || '').includes(document.querySelector('#detailTitle')?.textContent || '')
              }));
              if(!imageGenerationUI.visible || !imageGenerationUI.src.startsWith('data:image/') ||
                 !imageGenerationUI.usesCanon || !imageGenerationUI.usesLocation) {
                throw new Error('Image-generation preview was not created for the selected place and camera: '+JSON.stringify(imageGenerationUI));
              }

              // Let the independent source-photo lookup finish; capture the real
              // gallery result separately from the mocked image-generation result.
              const photoSearchSettled = await page.waitForFunction(
                () => {
                  const count = document.querySelector('#detailPhotoCount')?.textContent || '';
                  return !!count && !/searching|looking up|finding landmark/i.test(count);
                },
                null,
                { timeout: 25000 }
              ).then(() => true).catch(() => false);
              const photoReferenceDiagnostics = await page.evaluate(() => ({
                status: document.querySelector('#detailPhotoCount')?.textContent || '',
                titles: [...document.querySelectorAll('#detailPhotoRefs .detail-photo-title')].map(x => x.textContent || ''),
                sourceCards: document.querySelectorAll('#detailPhotoRefs .detail-photo').length,
                sketchCards: document.querySelectorAll('#selectedIdeaSketches .selected-idea-sketch').length,
                aiImageVisible: !document.querySelector('#aiImageResult')?.hidden
              }));
              const badPhotoTitle = /(event|festival|concert|tournament|championship|competition|match|team|players?|skatehockey|football|soccer|basketball|volleyball|hockey|marathon|race|wedding|birthday|graduation|crowd|spectators?|audience|selfie|portrait|headshot|family|children|athletes?|school class|group photo|u(?:1[0-9]|2[0-3])\\b|award ceremony|celebration|party|conference|meeting|demonstration|protest)/i;
              if(photoReferenceDiagnostics.titles.some(title => badPhotoTitle.test(title))) {
                throw new Error('Unrelated event/person photos appeared in the selected-spot gallery: '+JSON.stringify(photoReferenceDiagnostics));
              }
              if(photoReferenceDiagnostics.sketchCards !== 3 || !photoReferenceDiagnostics.aiImageVisible) {
                throw new Error('The no-photo fallback must retain three shot sketches and the generated concept: '+JSON.stringify(photoReferenceDiagnostics));
              }

              // Check the selected parking destinations carry human-readable distance
              // labels at close zoom, so map markers correlate with the parking list.
              await page.evaluate(() => {
                const test = window.__PHOTO_SCOUT_TEST__;
                const map = test.map;
                const center = test.getState().activeCenter;
                if(center) map.jumpTo({center:[center.lng,center.lat],zoom:16});
              });
              await page.waitForTimeout(600);
              const parkingDistanceDiagnostics = await page.evaluate(() => {
                const markers = [...document.querySelectorAll('.scout-marker.parking:not(.parking-cluster)')];
                return {
                  count: markers.length,
                  withDistance: markers.filter(m => !!m.getAttribute('data-distance')).length,
                  sample: markers.slice(0,8).map(m=>({title:m.title,distance:m.getAttribute('data-distance')}))
                };
              });
              if(parkingDistanceDiagnostics.count > 0 && parkingDistanceDiagnostics.withDistance === 0) {
                throw new Error('Close-zoom parking markers have no distance labels: '+JSON.stringify(parkingDistanceDiagnostics));
              }

              const distanceDiagnostics = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.getState().distanceDiagnostics || []);
              const inaccurateDistances = distanceDiagnostics.filter(item => item.delta > 2);
              if (inaccurateDistances.length) {
                throw new Error('Displayed search distances disagree with the actual coordinates: ' + JSON.stringify(inaccurateDistances.slice(0,5)));
              }
              const localityConflictDiagnostics = await page.evaluate(() => {
                const state = window.__PHOTO_SCOUT_TEST__.getState();
                const excluded = state.locationConflictExclusions || [];
                const visibleNames = [...document.querySelectorAll('.spot-card .spot-title')].map(node => node.textContent || '');
                return {
                  excluded,
                  exclusionLeak: excluded.filter(item => visibleNames.includes(item.name)),
                  dominantLocality: state.detectedLocality
                };
              });
              if (localityConflictDiagnostics.exclusionLeak.length) {
                throw new Error('A feature with a conflicting named locality still appears as a nearby candidate: ' + JSON.stringify(localityConflictDiagnostics));
              }

              await page.screenshot({ path: 'artifacts/photo-scout-live-map.png', fullPage: false });
              if (pageErrors.length) throw new Error('Browser runtime exceptions: ' + JSON.stringify(pageErrors));
              console.log('PHOTO_SCOUT_CHECKS ' + JSON.stringify({
                initial,
                primaryVectorTilesLoaded: hasVector,
                backupRasterTilesLoaded: rasterLoaded,
                pinWorkflow: 'passed',
                pinState,
                quickActions,
                appInstallDiagnostics,
                markerFixture,
                imageGenerationUI: {...imageGenerationUI,prompt:imageGenerationUI.prompt.slice(0,500)},
                photoSearchSettled,
                photoReferenceDiagnostics,
                parkingDistanceDiagnostics,
                distanceDiagnostics,
                localityConflictDiagnostics,
                parkingDiagnostics,
                browserExceptions: pageErrors,
                tileResponsesObserved: tileResponses.length
              }));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-scout-live-map
          path: artifacts/photo-scout-live-map.png
          if-no-files-found: ignore
