name: Photo Scout live map verification

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/photo-scout-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/photoscout-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/photoscout-http.log
          exit 1
      - name: Verify real vector map and map-click interaction
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            const tileResponses = [];
            const isVector = url => url.includes('.pbf') || url.includes('.mvt');
            page.on('pageerror', e => errors.push('PAGE: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            page.on('response', response => {
              if (response.url().includes('tiles.openfreemap.org')) tileResponses.push({url:response.url(),status:response.status()});
            });
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true, null, { timeout: 45000 });
            const deadline = Date.now() + 35000;
            while (Date.now() < deadline && !tileResponses.some(x => x.status >= 200 && x.status < 300 && isVector(x.url))) {
              await page.waitForTimeout(250);
            }
            const successfulVectorTiles = tileResponses.filter(x => x.status >= 200 && x.status < 300 && isVector(x.url));
            const failedVectorTiles = tileResponses.filter(x => x.status >= 400 && isVector(x.url));
            const initial = await page.evaluate(() => ({
              title: document.title,
              styleLoaded: window.__PHOTO_SCOUT_TEST__.styleLoaded,
              mapLoaded: window.__PHOTO_SCOUT_TEST__.map.loaded(),
              styleSources: Object.keys(window.__PHOTO_SCOUT_TEST__.map.getStyle().sources || {}).length
            }));
            if (!initial.styleLoaded || initial.styleSources < 1 || successfulVectorTiles.length < 1) {
              throw new Error('No successful live vector map tiles: ' + JSON.stringify({initial,tileResponses}));
            }
            await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.map.jumpTo({ center: [14.34873, 45.37306], zoom: 13 }));
            await page.waitForTimeout(700);
            const rect = await page.locator('#map').boundingBox();
            await page.mouse.click(Math.min(rect.x + rect.width * 0.54, 1500), rect.y + rect.height * 0.50);
            await page.waitForFunction(() => window.__PHOTO_SCOUT_TEST__?.scanCount >= 1, null, { timeout: 5000 });
            await page.waitForFunction(() => ['Photo stop ready', 'Stop research ready', 'Partial results loaded'].includes(document.querySelector('#statusTitle')?.textContent), null, { timeout: 90000 });
            const afterClick = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.getState());
            if (!afterClick.activeCenter || afterClick.scanCount < 1) {
              throw new Error('Clicking the geographic map did not start a scan: ' + JSON.stringify(afterClick));
            }
            if (!(afterClick.parkingCount > 0) || !(afterClick.parkingMarkerCount > 0)) {
              throw new Error('Parking records were found but no clickable Scout parking markers were shown: ' + JSON.stringify({
                parkingCount:afterClick.parkingCount,
                parkingMarkerCount:afterClick.parkingMarkerCount,
                parkingSample:afterClick.parkingSample
              }));
            }
            const ideaLabAtPin = await page.evaluate(() => ({
              visible: !!document.querySelector('#photoIdeaLabSection')?.getBoundingClientRect().height,
              sketchSrc: document.querySelector('#autoSketchImage')?.getAttribute('src') || '',
              target: document.querySelector('#conceptTargetName')?.textContent || '',
              generateButton: !!document.querySelector('#generateConcept')
            }));
            if (!ideaLabAtPin.visible || !ideaLabAtPin.sketchSrc.startsWith('data:image/svg+xml') || !ideaLabAtPin.generateButton || /Pin a place to start/i.test(ideaLabAtPin.target)) {
              throw new Error('Photo Idea Lab must show a location-specific sketch and generation control immediately after pin drop: ' + JSON.stringify(ideaLabAtPin));
            }
            if (!(afterClick.parkingLabelLayersFiltered || []).includes('poi_r20')) {
              throw new Error('The basemap parking-label replacement filter is missing: ' + JSON.stringify(afterClick.parkingLabelLayersFiltered));
            }
            if ((afterClick.parkingClusterMarkerCount || 0) > 0) {
              const zoomBeforeParkingClick = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.map.getZoom());
              const clusterSemanticsBefore = await page.locator('.scout-marker.parking-cluster').first().evaluate(el => ({
                text: el.querySelector('.dot-core')?.textContent || '',
                title: el.title || '',
                ariaLabel: el.getAttribute('aria-label') || ''
              }));
              if (clusterSemanticsBefore.text.startsWith('P') || !/not a destination/i.test(clusterSemanticsBefore.title)) {
                throw new Error('A parking cluster looks like a real parking destination rather than a count-only zoom control: ' + JSON.stringify(clusterSemanticsBefore));
              }
              await page.locator('.scout-marker.parking-cluster').first().click();
              await page.waitForFunction((z) => window.__PHOTO_SCOUT_TEST__.map.getZoom() > z + 1.5, zoomBeforeParkingClick, { timeout: 8000 });
              const parkingZoomResult = await page.evaluate(() => ({
                zoom:window.__PHOTO_SCOUT_TEST__.map.getZoom(),
                clusterCount:document.querySelectorAll('.scout-marker.parking-cluster').length,
                markerCount:document.querySelectorAll('.scout-marker.parking').length
              }));
              console.log('PARKING_CLUSTER_ZOOM_TEST ' + JSON.stringify({zoomBeforeParkingClick,clusterSemanticsBefore,parkingZoomResult}));
              if (!(parkingZoomResult.zoom > zoomBeforeParkingClick + 1.5)) {
                throw new Error('Clicking a parking cluster did not zoom to separate parking places: ' + JSON.stringify(parkingZoomResult));
              }
              await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.map.jumpTo({center:[14.354223,45.37306],zoom:12.25}));
              await page.waitForTimeout(350);
            }
            const scenicCardCount = await page.locator('#scenicResults .spot-card').count();
            const scenicGroupCount = await page.locator('#scenicResults .scenic-group').count();
            const mapParkingDiagnostics = await page.evaluate(() => {
              const map = window.__PHOTO_SCOUT_TEST__.map;
              let sourceFeatures = [];
              try { sourceFeatures = map.querySourceFeatures('openmaptiles', { sourceLayer: 'poi' }); } catch (e) {}
              const parking = sourceFeatures.filter(f => {
                const p = f.properties || {};
                return ['parking','parking_space'].includes(String(p.class || '').toLowerCase()) ||
                       ['parking','parking_space'].includes(String(p.subclass || '').toLowerCase()) ||
                       String(p.amenity || '').toLowerCase() === 'parking';
              }).slice(0, 12).map(f => ({id:f.id,geometry:f.geometry,properties:f.properties}));
              const parkingLayers = (map.getStyle().layers || []).filter(l => /^poi_r[0-9]+$/i.test(l.id)).map(l => ({id:l.id,filter:l.filter}));
              return { parkingFeatureCount: parking.length, parkingSamples: parking, appParkingCount:window.__PHOTO_SCOUT_TEST__.getState().basemapParkingCount, parkingLayers };
            });
            console.log('PHOTO_SCOUT_PARKING_DIAGNOSTICS ' + JSON.stringify({afterClick,mapParkingDiagnostics,scenicCardCount,scenicGroupCount}));
            if (!(afterClick.scenicCount > 0) || scenicCardCount < 1 || scenicGroupCount !== 3) {
              throw new Error('No grouped photo-spot candidates were displayed after scanning: ' + JSON.stringify({afterClick,scenicCardCount,scenicGroupCount}));
            }
            if (!(afterClick.scenicDistanceBands?.distant > 0)) {
              throw new Error('The wider search did not return any candidate 15 km or farther from the pin: ' + JSON.stringify(afterClick.scenicDistanceBands));
            }
            const unwantedPhotoTitle = /\b(event|festival|concert|tournament|championship|competition|match|team|players?|skatehockey|football|soccer|basketball|volleyball|hockey|marathon|race|bicycl\w*|cycling|biciklijad\w*|kolesar\w*|utrk\w*|dirk\w*|natjecanj\w*|utakmic\w*|turnir\w*|prired\w*|sejem\w*|wedding|birthday|graduation|crowd|spectators?|audience|selfie|portrait|headshot|family|children|athletes?|school class|group photo|tombstone|gravestone|cemetery|headstone|u(?:1[0-9]|2[0-3])\b|award ceremony|celebration|party|conference|meeting|demonstration|protest|zvoncari|zvončari|maškare|maskare|karneval|carnival|pust|fešta|festa|proslava|svetkovina|procession|parade)\b/i;
            if ((afterClick.photoTitles || []).some(name => unwantedPhotoTitle.test(name))) {
              throw new Error('Unrelated event/person media leaked into the photo references: ' + JSON.stringify(afterClick.photoTitles));
            }
            if ((afterClick.mapPhotoMarkerCount || 0) !== 0) {
              throw new Error('Photo upload coordinates should not be plotted as recommended places: ' + afterClick.mapPhotoMarkerCount);
            }
            const sablicPick = page.locator('#scenicResults .spot-card').filter({hasText:/Sablićevo/i});
            if (await sablicPick.count()) await sablicPick.first().click();
            else await page.locator('#scenicResults .spot-card').first().click();
            await page.waitForFunction(() => document.querySelector('#spotDetail')?.classList.contains('show'), null, { timeout: 5000 });
            await page.waitForFunction(() => document.querySelectorAll('#detailPhotoRefs .detail-photo').length > 0 || /No suitable source-linked image matched|No image refs/i.test(document.querySelector('#detailPhotoRefs')?.textContent || ''), null, { timeout: 30000 });
            // DOM cards alone don't prove the image URLs work. Wait for actual decoded thumbnails.
            await page.waitForTimeout(3500);
            const photoLoadDiagnostics = await page.evaluate(() => ({
              items: [...document.querySelectorAll('#detailPhotoRefs .detail-photo')].map(card => ({
                title: card.querySelector('img')?.alt || '',
                src: card.querySelector('img')?.currentSrc || card.querySelector('img')?.src || '',
                complete: !!card.querySelector('img')?.complete,
                naturalWidth: card.querySelector('img')?.naturalWidth || 0,
                naturalHeight: card.querySelector('img')?.naturalHeight || 0
              }))
            }));
            console.log('PHOTO_SCOUT_REFERENCE_IMAGE_LOADS ' + JSON.stringify(photoLoadDiagnostics));
            await page.waitForFunction(() => document.querySelectorAll('#spotParkingResults .parking-option').length > 0 || /No mapped parking feature was found/.test(document.querySelector('#spotParkingResults')?.textContent || ''), null, { timeout: 18000 });
            const selectedSpot = await page.evaluate(() => ({
              title: document.querySelector('#detailTitle')?.textContent,
              eyebrow: document.querySelector('#detailEyebrow')?.textContent,
              hasShotPrompt: (document.querySelector('#shotPrompt')?.value || '').includes('Canon EOS R50'),
              photoCount: document.querySelectorAll('#detailPhotoRefs .detail-photo').length,
              loadedPhotoCount: [...document.querySelectorAll('#detailPhotoRefs .detail-photo img')].filter(img => img.complete && img.naturalWidth > 80).length,
              photoStatus: document.querySelector('#detailPhotoCount')?.textContent,
              compositionCards: document.querySelectorAll('#photoIdeaDetails .concept-card').length,
              photoIdeaLabVisible: !!document.querySelector('#aiVisualBlock')?.getBoundingClientRect().height,
              autoSketchSrc: document.querySelector('#autoSketchImage')?.getAttribute('src') || '',
              selectedSketchSrc: document.querySelector('#selectedConceptPreviewImg')?.getAttribute('src') || '',
              detailHasJumpButton: !!document.querySelector('#jumpToPhotoIdeas'),
              hasSelectedGenerateButton: !!document.querySelector('#generateSelectedConcept'),
              nearbyParkingPanelVisible: !!document.querySelector('.selected-parking-block')?.getBoundingClientRect().height,
              nearbyParkingCount: document.querySelectorAll('#spotParkingResults .parking-option').length,
              nearbyParkingStatus: document.querySelector('#spotParkingCount')?.textContent,
              hasGenerateButton: !!document.querySelector('#generateConcept'),
              hasActualImageSlot: !!document.querySelector('#generatedVisual'),
              hasHeaderIdeaAccess: !!document.querySelector('#headerIdeaButton'),
              visible: !!document.querySelector('#spotDetail')?.getBoundingClientRect().height,
              markerWidth: getComputedStyle(document.querySelector('.scout-marker.photoSpot .dot-core')).width
            }));
            if (!selectedSpot.title || !selectedSpot.hasShotPrompt || selectedSpot.compositionCards !== 3 || !selectedSpot.photoIdeaLabVisible || !selectedSpot.autoSketchSrc.startsWith('data:image/') || !selectedSpot.selectedSketchSrc.startsWith('data:image/') || !selectedSpot.detailHasJumpButton || !selectedSpot.hasSelectedGenerateButton || !selectedSpot.nearbyParkingPanelVisible || selectedSpot.nearbyParkingCount < 1 || !selectedSpot.hasGenerateButton || !selectedSpot.hasActualImageSlot || !selectedSpot.visible) {
              throw new Error('Photo-spot detail panel did not contain the camera-specific workflow and image-generation control: ' + JSON.stringify(selectedSpot));
            }
            if (parseFloat(selectedSpot.markerWidth) < 30) {
              throw new Error('Photo-spot markers are still too small to notice: ' + JSON.stringify(selectedSpot));
            }
            // Abort the optional external AI call in CI. The app must still show
            // its instant location-specific sketch without API keys or provider availability.
            await page.route('https://image.pollinations.ai/**', route => route.abort());
            await page.locator('#conceptMode').selectOption('compressed');
            await page.locator('#generateConcept').click();
            await page.waitForFunction(() =>
              !document.querySelector('#generatedVisualWrap')?.hidden &&
              (document.querySelector('#generatedVisual')?.getAttribute('src') || '').startsWith('data:image/')
            , null, { timeout: 5000 });
            await page.waitForFunction(() => {
              const status = document.querySelector('#conceptStatus')?.textContent || '';
              return /instant sketch is ready|pencil sketch from the matched source photo|reference-based pencil sketch ready|AI pencil sketch returned|AI image service|no loaded place-matched/i.test(status);
            }, null, { timeout: 15000 });
            const generation = await page.evaluate(() => ({
              visible: !document.querySelector('#generatedVisualWrap')?.hidden,
              imageSrc: document.querySelector('#generatedVisual')?.getAttribute('src') || '',
              status: document.querySelector('#conceptStatus')?.textContent,
              selectedLens: document.querySelector('#selectedConceptLens')?.textContent || '',
              promptHasCanon: /Canon EOS R50/.test(document.querySelector('#shotPrompt')?.value || ''),
              promptHasSelectedSpot: (document.querySelector('#shotPrompt')?.value || '').includes(document.querySelector('#detailTitle')?.textContent || '')
            }));
            if (!generation.visible || !generation.imageSrc.startsWith('data:image/') || !/100–150 mm/.test(generation.selectedLens) || !generation.promptHasCanon || !generation.promptHasSelectedSpot) {
              throw new Error('Clicking Generate sketch idea did not keep a location-specific visual preview and Canon camera guidance visible: ' + JSON.stringify(generation));
            }
            const rangefindProbe = await page.evaluate(async () => {
              try {
                const { createSearch } = await import('https://esm.sh/rangefind@0.5.0/browser');
                const engine = await createSearch({
                  baseUrl: 'https://osm.rangefind.dev/',
                  multiRangeRequests: true,
                  geoCapsules: true,
                  geoCellIndexes: true
                });
                const response = await engine.search({
                  q: '',
                  geo: { near: { lat: 45.33, lon: 14.49, radiusMeters: 5000, sort: 'distance' } },
                  size: 100
                });
                return {
                  ok: true,
                  keys: Object.keys(response),
                  resultCount: response.results?.length ?? null,
                  sample: (response.results || []).slice(0, 5).map(x => x.doc || x)
                };
              } catch (e) {
                return { ok: false, error: String(e), stack: e && e.stack ? String(e.stack).slice(0, 1000) : '' };
              }
            });
            console.log('RANGEFIND_PROBE ' + JSON.stringify(rangefindProbe));
            if (!rangefindProbe.ok || !(rangefindProbe.resultCount > 0)) {
              throw new Error('Hosted OSM static index probe failed: ' + JSON.stringify(rangefindProbe));
            }
            await page.waitForTimeout(800);
            await page.screenshot({ path: 'artifacts/photo-scout-live-map.png', fullPage: false });
            console.log(JSON.stringify({ initial, afterClick, selectedSpot, generation, successfulVectorTiles:successfulVectorTiles.length, failedVectorTiles, observedMapProviderResponses:tileResponses.length, browserErrors:errors }, null, 2));
            if (failedVectorTiles.length) throw new Error('Map vector tile requests failed: ' + JSON.stringify(failedVectorTiles.slice(0, 10)));
            if (errors.some(x => /maplibre|webgl/i.test(x))) throw new Error('Map renderer browser errors: ' + JSON.stringify(errors));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save live map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-scout-live-map
          path: artifacts/photo-scout-live-map.png
          if-no-files-found: ignore
