name: Photo Scout live map verification

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/photo-scout-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/photoscout-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/photoscout-http.log
          exit 1
      - name: Verify real vector map and map-click interaction
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            const tileResponses = [];
            const isVector = url => url.includes('.pbf') || url.includes('.mvt');
            page.on('pageerror', e => errors.push('PAGE: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            page.on('response', response => {
              if (response.url().includes('tiles.openfreemap.org')) tileResponses.push({url:response.url(),status:response.status()});
            });
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => window.__PHOTO_SCOUT_TEST__?.styleLoaded === true, null, { timeout: 45000 });
            const deadline = Date.now() + 35000;
            while (Date.now() < deadline && !tileResponses.some(x => x.status >= 200 && x.status < 300 && isVector(x.url))) {
              await page.waitForTimeout(250);
            }
            const successfulVectorTiles = tileResponses.filter(x => x.status >= 200 && x.status < 300 && isVector(x.url));
            const failedVectorTiles = tileResponses.filter(x => x.status >= 400 && isVector(x.url));
            const initial = await page.evaluate(() => ({
              title: document.title,
              styleLoaded: window.__PHOTO_SCOUT_TEST__.styleLoaded,
              mapLoaded: window.__PHOTO_SCOUT_TEST__.map.loaded(),
              styleSources: Object.keys(window.__PHOTO_SCOUT_TEST__.map.getStyle().sources || {}).length
            }));
            if (!initial.styleLoaded || initial.styleSources < 1 || successfulVectorTiles.length < 1) {
              throw new Error('No successful live vector map tiles: ' + JSON.stringify({initial,tileResponses}));
            }
            await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.map.jumpTo({ center: [14.43, 45.33], zoom: 12 }));
            await page.waitForTimeout(500);
            const rect = await page.locator('#map').boundingBox();
            await page.mouse.click(Math.min(rect.x + rect.width * 0.72, 1500), rect.y + rect.height * 0.50);
            await page.waitForFunction(() => window.__PHOTO_SCOUT_TEST__?.scanCount >= 1, null, { timeout: 5000 });
            await page.waitForFunction(() => ['Photo stop ready', 'Stop research ready', 'Partial results loaded'].includes(document.querySelector('#statusTitle')?.textContent), null, { timeout: 90000 });
            const afterClick = await page.evaluate(() => window.__PHOTO_SCOUT_TEST__.getState());
            if (!afterClick.activeCenter || afterClick.scanCount < 1) {
              throw new Error('Clicking the geographic map did not start a scan: ' + JSON.stringify(afterClick));
            }
            const scenicCardCount = await page.locator('#scenicResults .spot-card').count();
            const scenicGroupCount = await page.locator('#scenicResults .scenic-group').count();
            if (!(afterClick.scenicCount > 0) || scenicCardCount < 1 || scenicGroupCount !== 3) {
              throw new Error('No grouped photo-spot candidates were displayed after scanning: ' + JSON.stringify({afterClick,scenicCardCount,scenicGroupCount}));
            }
            if (!(afterClick.scenicDistanceBands?.distant > 0)) {
              throw new Error('The wider search did not return any candidate 15 km or farther from the pin: ' + JSON.stringify(afterClick.scenicDistanceBands));
            }
            const unwantedPhotoTitle = /(event|festival|concert|tournament|championship|competition|match|team|players?|skatehockey|football|soccer|basketball|volleyball|hockey|marathon|race|wedding|birthday|graduation|crowd|spectators?|audience|selfie|portrait|headshot|family|children|athletes?|school class|group photo|u(?:1[0-9]|2[0-3])\\b|award ceremony|celebration|party|conference|meeting|demonstration|protest)/i;
            if ((afterClick.photoTitles || []).some(name => unwantedPhotoTitle.test(name))) {
              throw new Error('Unrelated event/person media leaked into the photo references: ' + JSON.stringify(afterClick.photoTitles));
            }
            if ((afterClick.mapPhotoMarkerCount || 0) !== 0) {
              throw new Error('Photo upload coordinates should not be plotted as recommended places: ' + afterClick.mapPhotoMarkerCount);
            }
            const sablicPick = page.locator('#scenicResults .spot-card').filter({hasText:/Sablićevo/i});
            if (await sablicPick.count()) await sablicPick.first().click();
            else await page.locator('#scenicResults .spot-card').first().click();
            await page.waitForFunction(() => document.querySelector('#spotDetail')?.classList.contains('show'), null, { timeout: 5000 });
            await page.waitForFunction(() => document.querySelectorAll('#detailPhotoRefs .detail-photo').length > 0 || /No suitable source-linked image matched|No image refs/i.test(document.querySelector('#detailPhotoRefs')?.textContent || ''), null, { timeout: 30000 });
            const selectedSpot = await page.evaluate(() => ({
              title: document.querySelector('#detailTitle')?.textContent,
              eyebrow: document.querySelector('#detailEyebrow')?.textContent,
              hasShotPrompt: (document.querySelector('#shotPrompt')?.value || '').includes('Canon EOS R50'),
              photoCount: document.querySelectorAll('#detailPhotoRefs .detail-photo').length,
              photoStatus: document.querySelector('#detailPhotoCount')?.textContent,
              compositionCards: document.querySelectorAll('#spotDetail .concept-card').length,
              hasGenerateButton: !!document.querySelector('#generateConcept'),
              hasActualImageSlot: !!document.querySelector('#generatedVisual'),
              imageProviderLoaded: !!window.puter?.ai?.txt2img,
              visible: !!document.querySelector('#spotDetail')?.getBoundingClientRect().height,
              markerWidth: getComputedStyle(document.querySelector('.scout-marker.photoSpot .dot-core')).width
            }));
            if (!selectedSpot.title || !selectedSpot.hasShotPrompt || selectedSpot.compositionCards !== 3 || !selectedSpot.hasGenerateButton || !selectedSpot.hasActualImageSlot || !selectedSpot.visible) {
              throw new Error('Photo-spot detail panel did not contain the camera-specific workflow and image-generation control: ' + JSON.stringify(selectedSpot));
            }
            if (parseFloat(selectedSpot.markerWidth) < 30) {
              throw new Error('Photo-spot markers are still too small to notice: ' + JSON.stringify(selectedSpot));
            }
            const providerProbe = await page.evaluate(async () => {
              try {
                return await Promise.race([
                  window.puter.ai.txt2img('Test-mode landscape image preview for Photo Scout', true).then(preview => ({
                    ok: !!(preview && preview.src),
                    sourcePrefix: preview && preview.src ? String(preview.src).slice(0, 32) : ''
                  })).catch(e => ({ ok:false, error:String(e && e.message || e).slice(0,500) })),
                  new Promise(resolve => setTimeout(() => resolve({ ok:false, timeout:true, error:'Provider test-mode request exceeded 20 seconds' }), 20000))
                ]);
              } catch (e) {
                return { ok: false, error: String(e && e.message || e).slice(0, 500) };
              }
            });
            console.log('PUTER_TEST_MODE_PROBE ' + JSON.stringify(providerProbe));
            // This external no-credit probe is diagnostic only. The preview UI is
            // independently tested below with a mocked response and generation remains
            // opt-in at runtime; a provider timeout must not fail map/scouting checks.
            // Mock the paid generation response in the UI test so CI doesn't make
            // a real generation request or incur image-generation usage.
            await page.evaluate(() => {
              window.__lastImagePrompt = '';
              window.puter = { ai: { txt2img: async (prompt, options) => {
                window.__lastImagePrompt = prompt + '\\nMODEL_OPTIONS=' + JSON.stringify(options);
                const image = document.createElement('img');
                image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#223e50"/><stop offset="1" stop-color="#deb88b"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sky)"/><circle cx="950" cy="150" r="70" fill="#fff0c2"/><path d="M0 430L230 250 420 400 625 210 810 390 1030 260 1280 420V720H0Z" fill="#718a83"/><path d="M0 520L180 460 380 500 580 400 760 500 1000 410 1280 505V720H0Z" fill="#263f39"/><path d="M360 540h560v180H360z" fill="#d2bc9d" opacity=".85"/></svg>');
                return image;
              } } };
            });
            await page.locator('#conceptMode').selectOption('compressed');
            await page.locator('#generateConcept').click();
            await page.waitForFunction(() => !document.querySelector('#generatedVisualWrap')?.hidden && document.querySelector('#generatedVisual')?.src.startsWith('data:image/svg+xml'), null, { timeout: 5000 });
            const generation = await page.evaluate(() => ({
              visible: !document.querySelector('#generatedVisualWrap')?.hidden,
              imageSrc: document.querySelector('#generatedVisual')?.getAttribute('src') || '',
              promptHasLens: /100–150 mm/.test(window.__lastImagePrompt || ''),
              promptHasLandmark: (window.__lastImagePrompt || '').includes(document.querySelector('#detailTitle')?.textContent || ''),
              status: document.querySelector('#conceptStatus')?.textContent
            }));
            if (!generation.visible || !generation.imageSrc.startsWith('data:image/') || !generation.promptHasLens || !generation.promptHasLandmark) {
              throw new Error('AI visual preview did not render the selected scene/prompt: ' + JSON.stringify(generation));
            }
                        const rangefindProbe = await page.evaluate(async () => {
              try {
                const { createSearch } = await import('https://esm.sh/rangefind@0.5.0/browser');
                const engine = await createSearch({
                  baseUrl: 'https://osm.rangefind.dev/',
                  multiRangeRequests: true,
                  geoCapsules: true,
                  geoCellIndexes: true
                });
                const response = await engine.search({
                  q: '',
                  geo: { near: { lat: 45.33, lon: 14.49, radiusMeters: 5000, sort: 'distance' } },
                  size: 100
                });
                return {
                  ok: true,
                  keys: Object.keys(response),
                  resultCount: response.results?.length ?? null,
                  sample: (response.results || []).slice(0, 5).map(x => x.doc || x)
                };
              } catch (e) {
                return { ok: false, error: String(e), stack: e && e.stack ? String(e.stack).slice(0, 1000) : '' };
              }
            });
            console.log('RANGEFIND_PROBE ' + JSON.stringify(rangefindProbe));
            if (!rangefindProbe.ok || !(rangefindProbe.resultCount > 0)) {
              throw new Error('Hosted OSM static index probe failed: ' + JSON.stringify(rangefindProbe));
            }
            await page.waitForTimeout(800);
            await page.screenshot({ path: 'artifacts/photo-scout-live-map.png', fullPage: false });
            console.log(JSON.stringify({ initial, afterClick, selectedSpot, generation, successfulVectorTiles:successfulVectorTiles.length, failedVectorTiles, observedMapProviderResponses:tileResponses.length, browserErrors:errors }, null, 2));
            if (failedVectorTiles.length) throw new Error('Map vector tile requests failed: ' + JSON.stringify(failedVectorTiles.slice(0, 10)));
            if (errors.some(x => /maplibre|webgl/i.test(x))) throw new Error('Map renderer browser errors: ' + JSON.stringify(errors));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save live map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-scout-live-map
          path: artifacts/photo-scout-live-map.png
          if-no-files-found: ignore
